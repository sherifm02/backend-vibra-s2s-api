service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$1
  hosts:
    - host: vibra-s2s-api.mf-uat.apistg.com
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: mf-uat.apistg.com
      paths:
        - path: /vibra-s2s-api/(.*)
          pathType: ImplementationSpecific

replicaCount: 3

memoryRequest: "200Mi"
cpuRequest: "400m"
memoryLimit: "1000Mi"
cpuLimit: "1200m"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 95
  #targetMemoryUtilizationPercentage: 90

podDisruptionBudget:
  #maxUnavailable: 1
  minAvailable: 2
