AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: '

  Sample SAM Template for local invocations

  '
Parameters:
    LocalDockerImageTagParam:
      Type: String
      Description: The Docker image tag for the in the ImageUri


Globals:
  Function:
    Timeout: 5
    MemorySize: 512
    Tracing: Active
  Api:
    TracingEnabled: true
Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
      # - x86_64
        - arm64
      Events:
        CatchAll:
          Type: Api
          Properties:
              Path: /{proxy+}
              Method: any
      Environment:
        Variables:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://host.docker.internal:5432/quarkus_main_3_1_0
#          QUARKUS_DATASOURCE_JDBC_URL: jdbc:otel:postgresql://host.docker.internal:5432/quarkus_main
          MF_SESSION_REDIS_HOSTS: host.docker.internal:6379
          MF_GAME_URL_LAYOUT: LEGACY
          MF_CONFIG_ENV: dev
      ImageUri: !Ref LocalDockerImageTagParam

  