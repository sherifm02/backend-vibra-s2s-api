quarkus.log.min-level=TRACE
quarkus.log.category."io.vertx.redis".level=TRACE
quarkus.log.category."io.quarkus.redis".level=TRACE

quarkus.security.security-providers=BC
mf.security.private-key."mf-jwt".path=keys/mf/privateKey-mf-jwt.pem
mf.security.private-key."mf-jwt".secret=770A8A65DA156D24EE2A093277530142

# Association cache config
mf.conf.cached-service.assc.cron.enabled=false
mf.conf.cached-service.assc.cron.expr=0/5 * * * * ?

# feature toggle cache config
mf.conf.cached-service.features.generation=20250424_01
mf.conf.cached-service.features.cron.expr=0/5 * * * * ?

# PLAYER_SEGMENTATION_CACHE_KEY cache config
mf.conf.cached-service."PLAYER_SEGMENTATION_CACHE_KEY".generation=20250424_01
mf.conf.cached-service."PLAYER_SEGMENTATION_CACHE_KEY".cron.expr=0/5 * * * * ?

# Tournament cache config
mf.conf.cached-service.tournamentsConfig.cron.enabled=false
mf.conf.cached-service.tournamentsConfig.cron.expr=0/5 * * * * ?

# Currency cache config
mf.conf.cached-service.currency.cron.enabled=false
mf.conf.cached-service.currency.cron.expr=0/5 * * * * ?
mf-fnd-currency-exchange.scheduler.enabled=false
mf-fnd-currency-exchange.scheduler.cron=0 * * * * ?

mf.security.pl-master-key."vibra-key".secret=pl-vibra-secret-password
