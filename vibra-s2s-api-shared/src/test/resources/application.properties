quarkus.redis.redis-session.hosts-provider-name=redis-session-hosts-provider-test
quarkus.redis.redis-blocking.hosts-provider-name=redis-session-hosts-provider-test
#quarkus.redis.redis-session.devservices.port=1111
mf.session.redis.protocol=redis://
#mf.session.redis.hosts=localhost:${quarkus.redis.redis-session.devservices.port}

quarkus.application.name=vibra-s2s-api-gameprovider
quarkus.native.add-all-charsets=true
quarkus.native.resources.includes=GeoLite2*
quarkus.ssl.native=true
#quarkus.devservices.enabled=true
quarkus.config.locations=geo-access-list.yaml,application-dev.properties


quarkus.rest-client.authenticate-api.connect-timeout=1000

quarkus.rest-client.authenticate-api-aln.uri=https://bo.roocasino.net/apis/megafair

quarkus.rest-client.authenticate-api-mfmock.uri=https://prod.bsg-mock.mfgapi.com

quarkus.rest-client.betresult-api.uri=${MF_BSG_BRAND_MOCK_BETRESULT_API_URI:http://localhost:8080}
#https://3l0cdoerei.execute-api.us-west-2.amazonaws.com/
#quarkus.rest-client.authenticate-api.user-agent=MegaFairClient/1.0

quarkus.rest-client.headers."X-MF-APP-NAME"=${quarkus.application.name}
quarkus.rest-client.headers."X-MF-APP-ID"=${quarkus.uuid}
quarkus.rest-client.read-timeout=1000
quarkus.rest-client.user-agent=MegaFairClient/1.0

#quarkus.http.header.Pragma.value=no-cache
#quarkus.http.header.Pragma.path=/headers/pragma
#quarkus.http.header.Pragma.methods=GET,HEAD
quarkus.rest-client.logging.scope=all
#request-response
quarkus.rest-client.logging.body-limit=1024
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG
quarkus.log.category."io.megafair.jinfra.foundation.interaction.recorder".level=DEBUG

quarkus.redis.redis-session.timeout=5s
#keep-alive
quarkus.redis.redis-session.tcp.keep-alive=true
quarkus.redis.redis-session.tcp.so-linger=4000s
quarkus.redis.redis-session.tcp.idle-timeout=6000s
#quarkus.redis.redis-session.tcp.
quarkus.redis.redis-session.max-pool-size=10
#quarkus.redis.tcp.idle-timeout=
#quarkus.redis.tcp.so-linger=300s
quarkus.redis.max-pool-size=6
quarkus.redis.tcp.keep-alive=true
quarkus.redis.tcp.idle-timeout=600s
quarkus.redis.tls.enabled=false
quarkus.redis.tls.trust-all=false

#postgres
quarkus.hibernate-orm.database.generation=validate
quarkus.datasource.db-kind=postgresql
#quarkus.datasource.username=master
#quarkus.datasource.password=postgres-local
#quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus_test
mf.player.progress.max-value-size-in-bytes=50000
