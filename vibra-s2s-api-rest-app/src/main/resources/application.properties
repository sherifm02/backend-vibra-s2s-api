#quarkus.rest-client.authenticate-api.user-agent=MegaFairClient/1.0

quarkus.rest-client.headers."X-MF-APP-NAME"=${quarkus.application.name}
quarkus.rest-client.headers."X-MF-APP-ID"=${quarkus.uuid}
quarkus.rest-client.read-timeout=1000
quarkus.rest-client.user-agent=MegaFairClient/1.0

#quarkus.http.header.Pragma.value=no-cache
#quarkus.http.header.Pragma.path=/headers/pragma
#quarkus.http.header.Pragma.methods=GET,HEAD
quarkus.rest-client.logging.scope=all
#request-response
quarkus.rest-client.logging.body-limit=10000
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG

#quarkus.redis.redis-session.hosts=redis://localhost:6379/
#quarkus.redis.redis-session.password=redis1redis1
quarkus.redis.redis-session.timeout=5s
quarkus.redis.redis-session.hosts-provider-name=redis-session-hosts-provider
quarkus.redis.redis-blocking.hosts-provider-name=redis-session-hosts-provider
#keep-alive
quarkus.redis.redis-session.tcp.keep-alive=true
quarkus.redis.redis-session.tcp.so-linger=4000s
quarkus.redis.redis-session.tcp.idle-timeout=6000s
#quarkus.redis.redis-session.tcp.
quarkus.redis.redis-session.max-pool-size=10
#quarkus.redis.tcp.idle-timeout=
#quarkus.redis.tcp.so-linger=300s
quarkus.redis.max-pool-size=6
quarkus.redis.tcp.keep-alive=true
quarkus.redis.tcp.idle-timeout=600s
quarkus.redis.tls.enabled=false
quarkus.redis.tls.trust-all=false

# shutdown handling
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=20s

#postgres
quarkus.hibernate-orm.database.generation=validate

quarkus.datasource.metrics.enabled=true
quarkus.datasource.jdbc.enable-metrics=true
quarkus.datasource.jdbc.telemetry=true
mf.player.progress.max-value-size-in-bytes=50000
