quarkus.application.name=vibra-s2s-api-gameprovider
quarkus.native.add-all-charsets=true
quarkus.native.resources.includes=GeoLite2*,jwt_keys/**
quarkus.ssl.native=true
quarkus.devservices.enabled=false

quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b %D ms %{ALL_REQUEST_HEADERS}
quarkus.http.access-log.exclude-pattern=/q/metrics
quarkus.http.record-request-start-time=true

quarkus.rest-client.authenticate-api.connect-timeout=1000

#quarkus.rest-client.authenticate-api-aln.uri=https://bo.roocasino.net/apis/megafair
#
#quarkus.rest-client.authenticate-api-mfmock.uri=https://prod.bsg-mock.mfgapi.com

