name: Check for foundation snapshot

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  check_for_foundation_snapshot:
    name: Check for foundation snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check pom.xml
        run: |
          if grep -qP 'SNAPSHOT' <<< $(grep '<mf.foundation.version>' pom.xml || true); then
            echo "Foundation snapshot version set in pom.xml, can't merge pull request"
            exit 1
          fi
